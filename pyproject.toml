[project]
name = "supportiq"
version = "0.1.0"
description = "AI-powered customer support platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app/api"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle style errors
    "F",   # pyflakes — unused imports, undefined names
    "I",   # isort — import sorting
    "B",   # bugbear — common bug patterns
    "UP",  # pyupgrade — forces modern Python syntax
    "SIM", # suggests simplifications
]
